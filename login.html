<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deadlink — вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0B0716">
<style>
:root{--bg:#0B0716;--ink:#F4EEFF;--mute:#A99BC9;--line:rgba(167,139,250,.24);--grad:linear-gradient(135deg,#7C3AED 0%,#A855F7 55%,#E879F9 100%);color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;color:var(--ink);font:16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 18% 12%,rgba(124,58,237,.45),transparent 70%),radial-gradient(38% 32% at 85% 28%,rgba(232,121,249,.25),transparent 70%),radial-gradient(50% 40% at 50% 100%,rgba(76,29,149,.5),transparent 70%)}
.box{width:100%;max-width:400px}
.logo{margin:0 0 6px;font:800 clamp(48px,14vw,72px)/1 Unbounded,sans-serif;letter-spacing:-.05em;display:flex;gap:.12em;justify-content:center}
.logo .d{color:transparent;-webkit-text-stroke:1.6px rgba(196,181,253,.6)}
.logo .l{background:linear-gradient(180deg,#fff,#F0ABFC);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(232,121,249,.55))}
.tag{text-align:center;color:var(--mute);margin:0 0 26px;font-size:14px}
.card{background:linear-gradient(160deg,rgba(40,26,84,.62),rgba(20,13,43,.78));border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 18px 50px rgba(5,0,20,.55),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:rgba(11,7,22,.55);border:1px solid var(--line);margin-bottom:18px}
.tabs button{border:0;border-radius:10px;padding:10px;background:none;color:var(--mute);font:600 14px Manrope,sans-serif;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--grad);color:#fff}
label{display:block;font-size:13px;color:var(--mute);margin:0 0 6px}
input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(11,7,22,.6);color:var(--ink);font:inherit;margin-bottom:14px;outline:none}
input:focus{border-color:#C084FC;box-shadow:0 0 0 3px rgba(192,132,252,.2)}
.go{width:100%;padding:13px;border:0;border-radius:14px;background:var(--grad);color:#fff;font:600 15px Unbounded,sans-serif;letter-spacing:.02em;cursor:pointer;box-shadow:0 10px 28px rgba(168,85,247,.4);margin-top:4px}
.go:disabled{opacity:.6;cursor:default}
.err{min-height:22px;margin:12px 0 0;font-size:14px;color:#FDA4AF;text-align:center}
.note{font-size:12.5px;color:var(--mute);margin:-6px 0 14px}
[hidden]{display:none!important}
#gbtn{display:flex;justify-content:center;min-height:44px}
.or{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--mute);font-size:12.5px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gmail{margin:0 0 14px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(11,7,22,.5);font-size:13.5px;color:var(--mute)}.gmail b{color:var(--ink)}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:-4px 0 12px}
.sc{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(167,139,250,.14);color:var(--ink);font:600 13px Manrope,sans-serif;cursor:pointer}.sc:disabled{opacity:.55;cursor:default}
.crow .note{margin:0}
.lnk{display:block;margin:12px auto 0;background:none;border:0;color:var(--mute);font:500 13px Manrope,sans-serif;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<main class="box">
<h1 class="logo" aria-label="Deadlink"><span class="d">dead</span><span class="l">link</span></h1>
<p class="tag">архив интернет-андера и электроники</p>
<div class="card">
<div class="tabs" role="tablist">
<button type="button" role="tab" id="tIn" aria-selected="true">Вход</button>
<button type="button" role="tab" id="tUp" aria-selected="false">Регистрация</button>
</div>
<div id="gw"><div id="gbtn"></div><p class="or"><span>или</span></p></div>
<form id="f" novalidate>
<p class="gmail" id="gm" hidden></p>
<label for="em" id="eml">Почта или ник</label>
<input id="em" name="email" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" inputmode="email" required>
<div id="cw" hidden>
<div class="crow"><button type="button" class="sc" id="sc">Отправить код на почту</button><span class="note" id="cn"></span></div>
<label for="code">Код из письма</label>
<input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 цифр">
</div>
<div id="nw" hidden>
<label for="nick">Ник</label>
<input id="nick" name="nick" autocomplete="nickname" autocapitalize="off" spellcheck="false">
<p class="note">От 3 до 20 символов: латиница, цифры, _ . - Его видят другие игроки.</p>
</div>
<label for="pw" id="pwl">Пароль</label>
<input id="pw" name="pw" type="password" autocomplete="current-password" required>
<div id="rep" hidden>
<label for="pw2">Пароль ещё раз</label>
<input id="pw2" name="pw2" type="password" autocomplete="new-password">
</div>
<button class="go" id="go">Войти</button>
<button type="button" class="lnk" id="fg">Забыл пароль</button>
<p class="err" id="err" role="alert"></p>
</form>
</div>
</main>
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async onload="window.gInit&&gInit()" onerror="document.getElementById('gw').hidden=true"></script>
<script>
try{if(localStorage.getItem('dl_token')&&localStorage.getItem('dl_me'))location.replace('./')}catch(e){}
let M='in',CD=0,GT=null;const GID='412045203172ce9m7pqasn5fs4trfssovqicdhot7q5n.apps.googleusercontent.com';const $=id=>document.getElementById(id);
const post=(u,b)=>fetch(DL_API+u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>({ok:r.ok,j:await r.json().catch(()=>({}))}));
function mode(m){M=m;$('gm').hidden=m!=='g';$('em').hidden=$('eml').hidden=m==='g';$('gw').hidden=m==='g';$('tIn').setAttribute('aria-selected',m!=='up'&&m!=='g');$('tUp').setAttribute('aria-selected',m==='up'||m==='g');
$('eml').textContent=m==='in'?'Почта или ник':'Почта';$('em').type=m==='in'?'text':'email';$('cw').hidden=m==='in'||m==='g';$('nw').hidden=m!=='up'&&m!=='g';$('rep').hidden=m==='in';
$('pwl').textContent=m==='reset'?'Новый пароль':'Пароль';$('pw').autocomplete=m==='in'?'current-password':'new-password';
$('go').textContent=m==='in'?'Войти':m==='up'||m==='g'?'Создать аккаунт':'Сменить пароль и войти';$('fg').textContent=m==='reset'||m==='g'?'← Назад ко входу':'Забыл пароль';$('fg').hidden=m==='up';$('err').textContent='';$('cn').textContent=''}
$('tIn').onclick=()=>mode('in');$('tUp').onclick=()=>mode('up');$('fg').onclick=()=>mode(M==='reset'||M==='g'?'in':'reset');
function tick(){const l=Math.ceil((CD-Date.now())/1000);$('sc').disabled=l>0;$('sc').textContent=l>0?`Отправить ещё раз через ${l} с`:'Отправить код на почту';if(l>0)setTimeout(tick,1000)}
$('sc').onclick=async()=>{const email=$('em').value.trim(),er=$('err');er.textContent='';if(!/^\S+@\S+\.\S+$/.test(email)){er.textContent='Впиши почту';return}
$('sc').disabled=true;try{const{ok,j}=await post('/api/auth/code',{email,p:M==='up'?'reg':'reset'});if(ok){$('cn').textContent='Код отправлен. Проверь и папку «Спам».';CD=Date.now()+60000;tick();$('code').focus()}else{er.textContent=j.error||'Не получилось отправить код';$('sc').disabled=false}}catch(x){er.textContent='Сервер не отвечает';$('sc').disabled=false}};
function done(j){try{localStorage.setItem('dl_token',j.token);localStorage.setItem('dl_me',JSON.stringify(j.user))}catch(e){$('err').textContent='Браузер не даёт сохранить вход (приватный режим?)';return false}location.replace('./');return true}
$('f').onsubmit=async e=>{e.preventDefault();const email=$('em').value.trim(),password=$('pw').value,er=$('err'),code=$('code').value.replace(/\D/g,'');er.textContent='';
if(M==='g'){if(password.length<6){er.textContent='Пароль должен быть не короче 6 символов';return}if(password!==$('pw2').value){er.textContent='Пароли не совпадают';return}}
else{if(!email||!password){er.textContent=M==='in'?'Введи почту и пароль':'Заполни все поля';return}
if(M!=='in'&&M!=='g'){if(code.length!==6){er.textContent='Введи 6 цифр из письма';return}if(password.length<6){er.textContent='Пароль должен быть не короче 6 символов';return}if(password!==$('pw2').value){er.textContent='Пароли не совпадают';return}}
}if((M==='up'||M==='g')&&!/^[A-Za-z0-9_.\-]{3,20}$/.test($('nick').value.trim())){er.textContent='Ник: от 3 до 20 символов, латиница, цифры, _ . -';return}
$('go').disabled=true;
try{const{ok,j}=M==='g'?await post('/api/auth/google/finish',{ticket:GT,login:$('nick').value.trim(),password}):M==='in'?await post('/api/login',{login:email,password}):M==='up'?await post('/api/register',{email,code,login:$('nick').value.trim(),password}):await post('/api/auth/reset',{email,code,password});
if(ok&&j.token){if(done(j))return}else er.textContent=j.error||'Что-то пошло не так'}catch(x){er.textContent='Сервер не отвечает. Проверь интернет и попробуй ещё раз.'}
$('go').disabled=false};
window.onGoogle=async function(res){const er=$('err');er.textContent='Проверяю вход через Google…';
try{const{ok,j}=await post('/api/auth/google',{credential:res.credential});if(ok&&j.token){done(j);return}
if(ok&&j.need==='signup'){GT=j.ticket;mode('g');$('gm').innerHTML='Почта из Google: <b></b><br>Придумай ник и пароль. Пароль нужен, чтобы входить и без Google, по почте.';$('gm').querySelector('b').textContent=j.email;$('nick').focus();return}
er.textContent=j.error||'Не получилось войти через Google'}catch(x){er.textContent='Сервер не отвечает'}};
function gInit(){try{google.accounts.id.initialize({client_id:GID,callback:onGoogle,ux_mode:'popup',auto_select:false});
google.accounts.id.renderButton($('gbtn'),{theme:'filled_black',size:'large',shape:'pill',text:'continue_with',logo_alignment:'center',width:Math.min(356,$('gbtn').clientWidth||320),locale:'ru'})}catch(e){$('gw').hidden=true}}
if(window.google&&google.accounts)gInit();
</script>
</body>
</html>
